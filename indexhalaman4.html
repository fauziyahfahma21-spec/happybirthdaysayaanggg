<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#140008">
<title>❤️ Crimson Love ❤️</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  min-height: 100%;
}

body {
  position: relative;
  overflow: hidden;
  min-height: 100vh;
  min-height: 100dvh;
  background: radial-gradient(circle at center, #30000b 0%, #140008 48%, #030004 100%);
  font-family: Arial, sans-serif;
  color: white;
}

#space {
  position: fixed;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
  z-index: 0;
}

.title {
  position: fixed;
  top: max(24px, calc(env(safe-area-inset-top) + 16px));
  left: 16px;
  right: 16px;
  width: auto;
  text-align: center;
  z-index: 2;
  pointer-events: none;
}

.title h1 {
  font-size: clamp(22px, 5.5vw, 42px);
  line-height: 1.2;
  letter-spacing: clamp(2px, 0.7vw, 5px);
  overflow-wrap: anywhere;
  background: linear-gradient(90deg, #ffb3c1, #ff1744, #8b001d, #ff4569, #ffb3c1);
  background-size: 300%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: shine 5s linear infinite;
  filter: drop-shadow(0 0 12px #ff1744);
}

.title p {
  font-size: clamp(9px, 2.2vw, 11px);
  letter-spacing: clamp(2px, 0.6vw, 4px);
  margin-top: 9px;
  color: #ff9cac;
  opacity: 0.8;
}

@keyframes shine {
  to { background-position: 300% center; }
}



.hint {
  position: fixed;
  bottom: max(12px, calc(env(safe-area-inset-bottom) + 5px));
  left: 90px;
  right: 16px;
  text-align: center;
  font-size: clamp(8px, 2vw, 10px);
  letter-spacing: clamp(1px, 0.4vw, 2px);
  color: #b96b7b;
  pointer-events: none;
}

.back {
  position: fixed;
  z-index: 6;
  left: max(14px, calc(env(safe-area-inset-left) + 8px));
  bottom: max(10px, calc(env(safe-area-inset-bottom) + 5px));
  display: inline-flex;
  align-items: center;
  gap: 7px;
  border: 1px solid rgba(255, 150, 170, .65);
  border-radius: 24px;
  padding: 9px 15px;
  background: rgba(80, 0, 20, .82);
  color: #ffe1e8;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 0 16px rgba(255, 0, 50, .18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

.back:active {
  transform: scale(.96);
}

@media (max-width: 600px) {
  .title {
    top: max(28px, calc(env(safe-area-inset-top) + 18px));
  }

  .hint {
    left: 105px;
    right: 10px;
    bottom: max(15px, calc(env(safe-area-inset-bottom) + 8px));
    font-size: 8px;
    letter-spacing: 1px;
  }

  .back {
    padding: 8px 12px;
    font-size: 11px;
  }
}

@media (max-height: 500px) and (orientation: landscape) {
  .title {
    top: max(10px, calc(env(safe-area-inset-top) + 6px));
  }

  .title p {
    margin-top: 4px;
  }

  .music {
    bottom: max(12px, calc(env(safe-area-inset-bottom) + 5px));
    left: auto;
    right: 14px;
    transform: none;
  }

  .hint {
    display: none;
  }
}

@media (prefers-reduced-motion: reduce) {
  .title h1 {
    animation: none;
  }
}
</style>
</head>

<body>
<canvas id="space"></canvas>

<div class="title">
  <h1>LOVE YOU ❤️</h1>
  <p>MADE WITH LOVE</p>
</div>

<div class="hint">A LITTLE PIECE OF MY HEART</div>

<button class="back" id="backBtn" type="button" aria-label="Kembali ke halaman sebelumnya">
  <span aria-hidden="true">←</span> Kembali
</button>

<script>
const canvas = document.getElementById("space");
const ctx = canvas.getContext("2d");
const backBtn = document.getElementById("backBtn");

let w, h, dpr;
let particles = [];
let stars = [];
let flowers = [];
let rotation = 0;
let progress = 0;
let lastTime = 0;
let heartScale = 1;
let elapsed = 0;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, window.innerWidth < 700 ? 1.5 : 1.8);
  w = window.innerWidth;
  h = window.innerHeight;

  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  canvas.style.width = w + "px";
  canvas.style.height = h + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // Skala hati dibatasi agar tetap proporsional pada layar kecil maupun lebar.
  heartScale = Math.min(w, h) * 0.023;
  createHeart();
  createStars();
  createFlowers();
}

function heartPoint(t) {
  return {
    x: 16 * Math.pow(Math.sin(t), 3),
    y: -(13 * Math.cos(t) - 5 * Math.cos(2 * t) -
      2 * Math.cos(3 * t) - Math.cos(4 * t))
  };
}

function createHeart() {
  particles = [];

  // Partikel tersebar sampai ke bagian dalam bentuk hati agar LOVE terlihat tebal/padat.
  const area = Math.min(w, h);
  const count = Math.max(1050, Math.min(2100, Math.floor(area * 2.15)));

  for (let i = 0; i < count; i++) {
    const t = Math.random() * Math.PI * 2;
    const edge = heartPoint(t);
    // Akar kuadrat membuat sebaran lebih merata dan tidak menumpuk di tengah.
    const fill = 0.12 + 0.88 * Math.sqrt(Math.random());
    const angle = Math.random() * Math.PI * 2;
    const distance = Math.max(w, h) * (0.32 + Math.random() * 0.72);

    particles.push({
      tx: edge.x * heartScale * fill,
      ty: edge.y * heartScale * fill,
      sx: Math.cos(angle) * distance,
      sy: Math.sin(angle) * distance,
      size: 0.8 + Math.random() * 1.9,
      delay: Math.random() * 0.38,
      twinkle: Math.random() * Math.PI * 2,
      hue: Math.random()
    });
  }
}

function createStars() {
  stars = [];
  for (let i = 0; i < 160; i++) {
    stars.push({
      x: Math.random() * w,
      y: Math.random() * h,
      size: Math.random() * 1.5 + 0.3,
      alpha: Math.random()
    });
  }
}

function drawStars(time) {
  for (const s of stars) {
    const a = 0.18 + 0.62 * (0.5 + 0.5 *
      Math.sin(time * 0.0011 + s.alpha * 12));
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size * (0.85 + a * 0.25), 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,195,211,${a})`;
    ctx.shadowColor = "rgba(255,80,125,.7)";
    ctx.shadowBlur = s.size * 3;
    ctx.fill();
  }
  ctx.shadowBlur = 0;
}

function drawHeart(time) {
  const cx = w / 2;
  const cy = h / 2;
  const pulse = 1 + Math.sin(time * 0.0017) * 0.012;
  const glowRadius = Math.min(w, h) * 0.46;
  const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, glowRadius);

  glow.addColorStop(0, "rgba(255,0,45,0.19)");
  glow.addColorStop(0.52, "rgba(180,0,35,0.08)");
  glow.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, w, h);

  const cos = Math.cos(rotation);
  const sin = Math.sin(rotation);

  // Titik kecil bercahaya tanpa shadow berat satu per satu, supaya frame lebih stabil.
  for (const p of particles) {
    const localProgress = Math.max(0, Math.min(1, (progress - p.delay) / 0.50));
    const ease = 1 - Math.pow(1 - localProgress, 3);
    const ox = p.sx + (p.tx - p.sx) * ease;
    const oy = p.sy + (p.ty - p.sy) * ease;
    const depth = ox * sin;
    const perspective = 1 + depth / 1250;
    const x = cx + ox * cos * pulse * perspective;
    const y = cy + oy * pulse * perspective;
    const sparkle = 0.62 + 0.38 * Math.sin(time * 0.0028 + p.twinkle);
    const alpha = sparkle * Math.min(1, localProgress * 2.2);
    const light = 48 + p.hue * 32;

    ctx.globalAlpha = alpha;
    ctx.fillStyle = `hsl(${350 + p.hue * 18}, 100%, ${light}%)`;
    ctx.beginPath();
    ctx.arc(x, y, p.size * (0.88 + sparkle * 0.18), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Kilau halus di sepanjang tepi hati.
  if (progress > 0.78) {
    for (let i = 0; i < 26; i++) {
      const t = i * Math.PI * 2 / 26;
      const point = heartPoint(t);
      const x = cx + point.x * heartScale * pulse;
      const y = cy + point.y * heartScale * pulse;
      const twinkle = 0.35 + 0.65 * Math.abs(Math.sin(time * 0.0028 + i * 1.7));

      ctx.globalAlpha = twinkle;
      ctx.fillStyle = "#ffe1e9";
      ctx.beginPath();
      ctx.arc(x, y, 1.1 + twinkle * 1.3, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
}

function createFlowers() {
  flowers = [];
  const count = Math.max(5, Math.min(11, Math.ceil(w / 105)));
  for (let i = 0; i < count; i++) {
    flowers.push({
      x: ((i + 0.5) / count) * w + (Math.random() - 0.5) * 24,
      height: Math.min(h * 0.25, 85 + Math.random() * 75),
      size: Math.max(8, Math.min(16, Math.min(w, h) * 0.022)),
      delay: 0.8 + i * 0.24 + Math.random() * 0.4,
      phase: Math.random() * Math.PI * 2,
      petals: 5 + Math.floor(Math.random() * 3),
      color: Math.random()
    });
  }
}

function flowerEase(v) {
  v = Math.max(0, Math.min(1, v));
  return 1 - Math.pow(1 - v, 3);
}

function drawFlowers(time) {
  const ground = h + 2;

  for (const f of flowers) {
    const growth = flowerEase((elapsed - f.delay) / 2.0);
    if (growth <= 0) continue;

    const sway = Math.sin(time * 0.0011 + f.phase) * 5 * growth;
    const stemH = f.height * growth;
    const stemX = f.x + sway * 0.35;
    const flowerY = ground - stemH;

    ctx.save();
    ctx.lineCap = "round";

    // Tangkai tumbuh dari tepi bawah layar.
    ctx.strokeStyle = "#4dba72";
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.moveTo(f.x, ground);
    ctx.quadraticCurveTo(f.x - sway, ground - stemH * 0.55, stemX, flowerY);
    ctx.stroke();

    // Daun muncul bertahap pada tangkai.
    for (let j = 0; j < 2; j++) {
      const leafAt = j === 0 ? 0.38 : 0.67;
      if (growth < leafAt * 0.55) continue;
      const leafProgress = flowerEase((growth - leafAt * 0.55) / 0.45);
      const yy = ground - stemH * leafAt;
      const side = j === 0 ? -1 : 1;

      ctx.save();
      ctx.translate(f.x + sway * leafAt * 0.35, yy);
      ctx.rotate(side * 0.48);
      ctx.fillStyle = "#65c982";
      ctx.beginPath();
      ctx.ellipse(side * 7, 0, 8 * leafProgress, 3.5 * leafProgress, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // Kuncup membesar, lalu kelopak membuka.
    const bloom = flowerEase((elapsed - f.delay - 1.0) / 1.3);
    const r = f.size * (0.22 + bloom * 0.78);
    const bob = Math.sin(time * 0.0017 + f.phase) * 1.4;

    ctx.translate(stemX, flowerY + bob);
    ctx.rotate(Math.sin(time * 0.001 + f.phase) * 0.06);

    if (bloom < 0.08) {
      ctx.fillStyle = "#ff789f";
      ctx.beginPath();
      ctx.ellipse(0, 0, r * 0.34, r * 0.68, 0, 0, Math.PI * 2);
      ctx.fill();
    } else {
      const palettes = [
        ["#ffe1eb", "#ff78a0"],
        ["#ffc4d7", "#f83e79"],
        ["#ffd4df", "#ff91ad"]
      ];
      const palette = palettes[Math.floor(f.color * palettes.length)];
      const open = 0.2 + bloom * 0.8;

      for (let k = 0; k < f.petals; k++) {
        const angle = (Math.PI * 2 * k / f.petals) - Math.PI / 2;
        ctx.save();
        ctx.rotate(angle);
        ctx.translate(0, -r * 0.42 * open);
        ctx.scale(0.72, open);
        const grad = ctx.createLinearGradient(0, -r, 0, r * 0.3);
        grad.addColorStop(0, palette[0]);
        grad.addColorStop(1, palette[1]);
        ctx.fillStyle = grad;
        ctx.shadowColor = "rgba(255,85,135,.6)";
        ctx.shadowBlur = 7;
        ctx.beginPath();
        ctx.ellipse(0, -r * 0.2, r * 0.39, r * 0.64, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      ctx.shadowColor = "rgba(255,224,130,.9)";
      ctx.shadowBlur = 8;
      ctx.fillStyle = "#ffdc78";
      ctx.beginPath();
      ctx.arc(0, 0, r * 0.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    ctx.restore();
  }
}

function animate(time) {
  requestAnimationFrame(animate);

  const dt = lastTime ? Math.min((time - lastTime) / 1000, 0.05) : 1 / 60;
  lastTime = time;
  elapsed += dt;

  ctx.clearRect(0, 0, w, h);
  drawStars(time);

  if (progress < 1) {
    progress = Math.min(1, progress + 0.22 * dt);
  }
  if (progress > 0.75) {
    rotation += 0.22 * dt;
  }
  // Putaran partikel dan kilau bergerak konsisten pada 30/60/120Hz.
  for (const p of particles) {
    p.angle += p.spin * dt * 60;
  }

  drawHeart(time);
  drawFlowers(time);
}

document.addEventListener("visibilitychange", () => {
  // Hindari lonjakan waktu saat tab kembali aktif.
  lastTime = 0;
});

window.addEventListener("resize", resize);

// Tombol kembali ke halaman sebelumnya
backBtn.addEventListener("click", () => {
  if (window.history.length > 1) {
    window.history.back();
  } else {
    // Jika halaman dibuka langsung, tampilkan pesan sederhana.
    backBtn.textContent = "← Tidak ada halaman sebelumnya";
    setTimeout(() => {
      backBtn.innerHTML = '<span aria-hidden="true">←</span> Kembali';
    }, 1800);
  }
});

resize();
requestAnimationFrame(animate);
</script>
</body>
</html>
